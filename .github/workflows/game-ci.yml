name: Game CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-sanskrit-strands:
    name: Validate, stress-test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate puzzle data
        run: npm run validate:puzzles

      - name: Stress-test randomized boards
        run: npm run test:boards

      - name: Type-check and build
        run: npm run build
